{% extends "layout.html" %}
{% block content %}
<div class="auth-container">
    <h2>Reset Your Password</h2>
    <p>Enter your email below and we will send you a recovery link.</p>
    <form method="POST" class="reset-form">
        <input type="email" name="email" placeholder="Enter your email here" required class="field-input">
        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>
</div>
{% endblock %}
