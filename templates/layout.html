<!DOCTYPE html>
<html lang="en">
<head>
  <!--character encoding-->
    <meta charset="UTF-8">
    <!--mobile responsiveness-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title on tab-->
    <title>Tone Sense</title>
    <!--css file-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <!--the favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>

<body>
<!--navigation bar-->    
<nav class="navbar">
    <div class="nav-container">
        <!--logo and name in the navbar-->
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" class="nav-logo-img">
            <span class="site-name">Tone Sense</span>
        </div>
        <!--nav links on navbar -->
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('signup') }}">Sign Up</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('about_us') }}">About Us</a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- main container -->
<main class="main-content">
<div class="container">
    {% block content %}{% endblock %}
</div>
</main>
<!--js file-->
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<!--site footer-->
<footer class="site-footer">
  <div class="footer-content">
    <p> &copy; 2026 Tone Sense. All rights reserved.</p>
    <!--footer nav links-->
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">User Rights and Security</a>
    </div>
  </div>
</footer>

</body>
</html>
